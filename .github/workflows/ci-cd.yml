name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: url-shortener-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: moyezr/url-shortener
  NODE_VERSION: "24"

jobs:
  test:
    name: Test and build app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create image tag
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "ref=${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and restart container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
        run: |
          IMAGE_REF="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "IMAGE_REF='$IMAGE_REF' EC2_ENV_FILE='$EC2_ENV_FILE' bash -s" <<'REMOTE'
          set -euo pipefail

          : "${IMAGE_REF:?IMAGE_REF is required}"

          ENV_FILE="${EC2_ENV_FILE:-$HOME/url-shortener/.env.prod}"

          docker pull "$IMAGE_REF"
          docker rm -f url-shortener || true
          docker run -d \
            --name url-shortener \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 127.0.0.1:3000:3000 \
            -v url-shortener-data:/app/data \
            "$IMAGE_REF"

          sleep 2
          curl -fsS http://127.0.0.1:3000/health
          REMOTE
